services:
  web:
    build: .
    container_name: arlist-main-site
    restart: always
    ports:
      - "8086:8086"
    environment:
      NODE_ENV: production
    env_file: .env
    depends_on:
      - db
    networks:
      - arlist-network

  db:
    image: postgres:16-alpine
    container_name: arlist-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-arlist}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arlist-network

volumes:
  postgres_data:

networks:
  arlist-network:
    driver: bridge
