<div class="container">
    <main class="content">
        <span class="label reveal" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; color: var(--ac-gray-30); margin-bottom: 24px; display: block; font-family: var(--font-mono);">Юридический отдел</span>
        <h1 class="reveal" style="font-size: clamp(2rem, 6vw, 4rem); line-height: 1.1; letter-spacing: -0.06em; margin-bottom: 60px; font-weight: 400;">Документация и соглашения</h1>
        <ul id="doc-list" class="doc-list" style="list-style: none; margin-top: 40px;">
            <!-- Will be populated by JS -->
        </ul>
    </main>
</div>

<script src="/js/global.js"></script>
<script>
    fetch('./config.json')
        .then(r => r.json())
        .then(data => {
            const list = document.getElementById('doc-list');
            data.forEach(doc => {
                const li = document.createElement('a');
                li.href = `/legal/${doc.slug}`;
                li.className = 'doc-item reveal';
                li.style.cssText = 'margin-bottom: 32px; padding: 40px; border: 1px solid rgba(255, 255, 255, 0.05); transition: all var(--transition); position: relative; overflow: hidden; display: block; text-decoration: none; color: inherit; background: #050505;';
                li.innerHTML = `
                    <span class="doc-link" style="text-decoration: none; color: var(--ac-white); font-size: 1.5rem; font-weight: 500; display: block; margin-bottom: 12px; letter-spacing: -0.02em;">${doc.title}</span>
                    <div class="doc-meta" style="font-size: 12px; color: var(--ac-gray-40); letter-spacing: 0.02em;">${doc.date} • ${doc.description}</div>
                `;
                list.appendChild(li);

                // Use a temporary observer to handle dynamic reveals if global one is not exported
                const tempObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            tempObserver.unobserve(entry.target);
                        }
                    });
                });
                tempObserver.observe(li);
            });
        });
</script>

</body>
