<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Груснуб | Арлист</title>
    <meta name="description" content="Сообщение о закрытии geotekt.arlist.tech и контакты для связи.">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/style.css">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            --ac-black: #000000;
            --ac-white: #ffffff;
            --ac-gray-20: rgba(255, 255, 255, 0.2);
            --ac-gray-40: rgba(255, 255, 255, 0.4);
            --font-sans: 'Geist Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'Geist Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% -20%, #151515 0%, #000 80%);
            color: var(--ac-white);
            font-family: var(--font-sans);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 48px 24px 72px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        .logo {
            color: var(--ac-white);
            text-decoration: none;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.9rem;
        }

        .home {
            color: var(--ac-gray-40);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .home:hover { color: var(--ac-white); }

        .ascii {
            font-family: var(--font-mono);
            white-space: pre;
            color: var(--ac-gray-40);
            font-size: 13px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: -0.04em;
            line-height: 1.1;
            margin-bottom: 24px;
        }

        .article {
            display: grid;
            gap: 16px;
            margin-bottom: 40px;
            max-width: 760px;
        }

        .article p {
            color: var(--ac-gray-40);
            font-size: 1.05rem;
        }

        .contacts {
            border-top: 1px solid var(--ac-gray-20);
            padding-top: 24px;
            display: grid;
            gap: 10px;
        }

        .contacts-title {
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            color: var(--ac-gray-40);
        }

        .contacts a {
            color: var(--ac-white);
            text-decoration: none;
            width: fit-content;
        }

        .contacts a:hover { opacity: 0.75; }
    </style>
</head>
<body>
    <div class="container">
        <header class="top">
            <a href="/" class="logo">Арлист</a>
            <a href="/" class="home">На главную</a>
        </header>

        <main>
            <div class="ascii">
 /\_/\
( o.o )
 > ^ <
            </div>
            <h1>груснуб.обидняб.сегодня без тыкдыков...</h1>

            <section class="article">
                <p>Мы закрыли geotekt.arlist.tech.</p>
            </section>

            <section class="contacts">
                <span class="contacts-title">Контакты</span>
                <a href="mailto:hello@arlist.ru">hello@arlist.ru</a>
            </section>
        </main>
    </div>
</body>
</html>
