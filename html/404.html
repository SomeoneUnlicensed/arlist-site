<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ошибка 404 | ЧОЙТА - мы такого не знаем</title>
    
    <!-- Geist Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/style.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            --ac-black: #000000;
            --ac-white: #ffffff;
            --ac-gray-30: rgba(255, 255, 255, 0.3);
            --ac-gray-40: rgba(255, 255, 255, 0.4);
            --font-sans: 'Geist Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'Geist Mono', monospace;
            --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--ac-black);
            color: var(--ac-white);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #151515 0%, #000 80%);
            z-index: -1;
        }

        .content {
            padding: 20px;
            max-width: 600px;
            animation: fadeIn 1s var(--transition);
        }

        .ascii-cat {
            font-family: var(--font-mono);
            white-space: pre;
            font-size: 14px;
            line-height: 1.2;
            color: var(--ac-gray-30);
            margin-bottom: 40px;
            user-select: none;
            display: inline-block;
            text-align: left;
        }

        .error-label {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--ac-gray-40);
            margin-bottom: 16px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: 600;
            letter-spacing: -0.04em;
            margin-bottom: 24px;
            line-height: 1.2;
        }

        p {
            font-size: 1.1rem;
            color: var(--ac-gray-40);
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .back-link {
            display: inline-block;
            color: var(--ac-white);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 12px 24px;
            border: 1px solid var(--ac-gray-40);
            border-radius: 4px;
            transition: var(--transition);
        }

        .back-link:hover {
            background: var(--ac-white);
            color: var(--ac-black);
            border-color: var(--ac-white);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="content">
    <div class="ascii-cat">
 /\_/\   ⚡
( O.O )  /
 > ^ <  /_
 /    \
 | | | |
(_|_|_)
    </div>
    <div class="error-label">ОШИБКА 404</div>
    <h1>ЧОЙТА — мы такого не знаем!</h1>
    <p>Спасити памагити, тут темно, страшно и нет нужной страницы... Может, скорее вернемся на главную, пока нас никто не покусал?</p>
    <a href="/" class="back-link">Эвакуироваться на главную</a>
</div>

</body>
</html>
