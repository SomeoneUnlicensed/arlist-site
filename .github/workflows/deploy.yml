name: Deploy Production

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, production]

    steps:
      - name: Free disk space
        run: |
          df -h /
          docker image prune -a -f || true
          docker builder prune -a -f || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t arlistru-web:latest .

      - name: Import image into k3s containerd
        run: |
          docker save arlistru-web:latest -o /tmp/arlistru-web.tar
          sudo k3s ctr -n k8s.io images import --all-platforms /tmp/arlistru-web.tar
          rm -f /tmp/arlistru-web.tar

      - name: Restart deployment (rolling update)
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          kubectl -n production rollout restart deploy/arlist-site
          kubectl -n production rollout status deploy/arlist-site --timeout=300s

      - name: Verify deployment
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          sleep 5
          POD=$(kubectl -n production get pod -l app=arlist-site -o jsonpath='{.items[0].metadata.name}')
          kubectl -n production exec "$POD" -- wget -qO- http://127.0.0.1:8086/api/health || echo "::warning::health check failed"

      - name: Cleanup
        if: always()
        run: |
          docker image prune -a -f || true
          docker builder prune -a -f || true
          df -h /