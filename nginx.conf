server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /promo/manifest {
        alias /usr/share/nginx/html/promo/manifest/;
        index index.html;
        try_files $uri $uri/ /promo/manifest/index.html;
    }

    location /promo/ {
        alias /usr/share/nginx/html/promo/;
        index index.html;
        autoindex on;
    }

    error_page 403 404 = /;
}
