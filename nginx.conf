server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /research {
        try_files /research/index.html =404;
    }

    location = /research/ {
        try_files /research/index.html =404;
    }

    location ^~ /research/ {
        try_files $uri $uri/ =404;
    }

    location = /gr {
        try_files /gr/index.html =404;
    }

    location = /gr/ {
        try_files /gr/index.html =404;
    }

    location ^~ /gr/ {
        try_files $uri $uri/ =404;
    }

    location = /forEdu {
        try_files /forEdu/index.html =404;
    }

    location = /forEdu/ {
        try_files /forEdu/index.html =404;
    }

    location ^~ /forEdu/ {
        try_files $uri $uri/ =404;
    }

    location = /promo {
        try_files /promo/index.html =404;
    }

    location = /promo/ {
        try_files /promo/index.html =404;
    }

    location ^~ /promo/ {
        try_files $uri $uri/ /;
    }

    location = /legal {
        try_files /legal/index.html =404;
    }

    location = /legal/ {
        try_files /legal/index.html =404;
    }

    location ^~ /legal/docs/ {
        try_files $uri =404;
    }

    location = /legal/viewer.html {
        try_files $uri =404;
    }

    location ~ ^/legal/[a-z0-9-]+/?$ {
        try_files /legal/viewer.html =404;
    }

    location /legal/ {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
