server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Promo section
    location /promo/manifest {
        try_files /promo/manifest/index.html =404;
    }

    location /promo/ {
        try_files $uri $uri/ =404;
    }

    # Legal section: Handle both the list and individual documents
    location /legal {
        # If it's exactly /legal or /legal/, show the list
        location ~ ^/legal/?$ {
            try_files /legal/index.html =404;
        }
        
        # If it's /legal/something, try the file first, then fall back to viewer.html
        location ~ ^/legal/(.+)$ {
            try_files $uri /legal/viewer.html =404;
        }
    }

    # Redirect 404s to home, but only after all location matches failed
    error_page 404 /;
}
