server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /promo/manifest {
        alias /usr/share/nginx/html/promo/manifest/;
        index index.html;
        try_files $uri $uri/ /promo/manifest/index.html;
    }

    location /promo/ {
        alias /usr/share/nginx/html/promo/;
        index index.html;
        autoindex on;
    }

    # Fix: Correctly handle /legal/slug to use viewer.html without 404 redirect
    location ~ ^/legal/([a-zA-Z0-9_-]+)$ {
        try_files /legal/viewer.html =404;
    }

    location /legal/ {
        alias /usr/share/nginx/html/legal/;
        index index.html;
        autoindex on;
    }

    # Redirect actual errors to root
    error_page 404 = /;
}
